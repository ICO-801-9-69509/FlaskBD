{% extends "layout.html" %} {% block container %}

<div class="max-w-sm p-6 bg-slate-900 border border-slate-800 rounded-2xl shadow-xl mx-auto">
    <div class="flex flex-col items-center">
        <!-- Enlarged User Icon Container -->
        <div class="p-4 bg-blue-500/10 rounded-full mb-4">
            <svg class="w-16 h-16 text-blue-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20">
                <path d="M10 0a10 10 0 1 0 10 10A10.011 10.011 0 0 0 10 0Zm0 5a3 3 0 1 1 0 6 3 3 0 0 1 0-6Zm0 13a8.949 8.949 0 0 1-4.951-1.488A3.987 3.987 0 0 1 9 13h2a3.987 3.987 0 0 1 3.951 3.512A8.949 8.949 0 0 1 10 18Z" />
            </svg>
        </div>

        <h5 class="text-2xl font-bold tracking-tight text-white text-center leading-tight">
            {{alumno.nombre}} {{alumno.apaterno}} {{alumno.amaterno}}
        </h5>

        <div class="mt-3 text-center">
            <p class="text-blue-300/80 font-medium">Correo: {{alumno.correo}}</p>
            <p class="text-blue-300/80 font-medium">Edad: {{alumno.edad}}</p>
        </div>

        <!-- Corrected Button with closing tag and Left Arrow -->
        <a href="/alumnos" class="mt-6 inline-flex items-center justify-center text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:ring-blue-800 font-medium rounded-lg text-sm px-5 py-2.5 transition-colors">
            <svg class="w-4 h-4 me-2" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
            </svg>
            Regresar
        </a>
    </div>
</div>



{% endblock %}
