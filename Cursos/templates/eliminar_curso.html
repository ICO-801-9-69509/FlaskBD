{% extends "layout.html" %}
{% block container %}

<div class="flex items-center justify-center min-h-[calc(100vh-80px)] p-4">
    <div class="bg-gray-800 dark:bg-gray-900 w-full max-w-sm p-8 border border-gray-700 rounded-xl shadow-2xl">
        <h5 class="mb-4 text-xl font-bold tracking-tight text-white leading-tight text-center">
            ¿Está seguro de que desea eliminar este registro?
        </h5>
        
        <div class="mb-8 space-y-2 bg-gray-700/30 p-4 rounded-lg border border-gray-700">
            {% for key, value in curso.items() %}
            <p class="text-gray-300 text-sm">
                <span class="font-semibold text-gray-100">{{ key }}:</span> {{ value }}
            </p>
            {% endfor %}
        </div>

        <form method="post" class="flex flex-col sm:flex-row items-center gap-3">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold px-4 py-2.5 rounded-lg transition-all active:scale-95">
                Eliminar
            </button>

            <a href="/maestros" class="w-full text-center bg-gray-700 hover:bg-gray-600 text-gray-200 font-medium px-4 py-2.5 rounded-lg transition-all border border-gray-600">
                Cancelar
            </a>
        </form>
    </div>
</div>

{% endblock %}
